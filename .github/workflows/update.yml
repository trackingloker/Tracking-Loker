name: Tarik lowongan harian

on:
  schedule:
    # Jadwal GitHub sering telat atau terlewat, jadi tiap sesi punya beberapa jadwal cadangan.
    # Jadwal cadangan langsung berhenti bila data sesi itu sudah ada (lihat langkah "Perlu menarik?").
    # Pagi (WIB): 05.13, 06.23, 07.37, 09.07
    - cron: "13 22 * * *"
    - cron: "23 23 * * *"
    - cron: "37 0 * * *"
    - cron: "7 2 * * *"
    # Malam (WIB): 18.13, 19.23, 20.37
    - cron: "13 11 * * *"
    - cron: "23 12 * * *"
    - cron: "37 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tarik-lowongan
  cancel-in-progress: false

jobs:
  tarik:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Perlu menarik?
        id: perlu
        env:
          EVENT: ${{ github.event_name }}
        run: python3 update.py --perlu >> "$GITHUB_OUTPUT"

      - name: Pasang pembaca PDF
        if: steps.perlu.outputs.jalan == 'true'
        # Beberapa perusahaan (mis. Vale) memasang lowongan sebagai PDF. Tanpa pypdf, lowongan itu cukup diberi catatan.
        run: |
          python3 -m pip install --user --quiet pypdf \
            || python3 -m pip install --user --quiet --break-system-packages pypdf \
            || echo "pypdf tidak terpasang, lowongan PDF diberi catatan saja."

      - name: Uji penarik data
        if: steps.perlu.outputs.jalan == 'true'
        run: python3 -m unittest -q test_update

      - name: Tarik lowongan
        if: steps.perlu.outputs.jalan == 'true'
        run: python3 update.py

      - name: Simpan data baru
        if: steps.perlu.outputs.jalan == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # detail/ berisi deskripsi lowongan dan logo dari situs karier perusahaan.
          git add jobs.json links.json stats.json detail
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
            exit 0
          fi
          git commit -m "Data lowongan $(TZ=Asia/Jakarta date +'%d-%m-%Y %H.%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
